<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Kairo — 30s spot</title>
<link rel="stylesheet" href="node_modules/@fontsource-variable/inter/index.css">
<link rel="stylesheet" href="node_modules/@fontsource-variable/inter-tight/index.css">
<style>
  :root {
    --grad: linear-gradient(95deg, #9583ff 0%, #d66bf5 48%, #ff8a5b 100%);
    --ink: #f5f5f7;
    --mute: #86868b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1920px; height: 1080px; background: #000; overflow: hidden; }
  #stage {
    position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #000;
    color: var(--ink); font-family: 'Inter Variable', sans-serif;
    -webkit-font-smoothing: antialiased; font-feature-settings: 'cv11', 'ss01';
  }
  .scene { position: absolute; inset: 0; display: none; }
  .abs { position: absolute; left: 0; top: 0; will-change: transform, opacity; }
  .ctr { width: 1920px; text-align: center; }
  .h { font-family: 'Inter Tight Variable', sans-serif; font-weight: 700; letter-spacing: -0.045em; line-height: 1.04; white-space: nowrap; }
  .grad { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .tnum { font-feature-settings: 'tnum'; }

  /* ---------- S1 chaos ---------- */
  .pill {
    display: flex; align-items: center; gap: 14px; white-space: nowrap;
    padding: 16px 28px 16px 22px; border-radius: 999px;
    background: rgba(34, 35, 40, .94); border: 1px solid rgba(255,255,255,.09);
    font-size: 26px; font-weight: 500; color: #e8e8ed; box-shadow: 0 14px 40px rgba(0,0,0,.55);
  }
  .pill i { width: 12px; height: 12px; border-radius: 50%; display: block; }
  .note {
    width: 420px; display: flex; gap: 16px; align-items: flex-start; padding: 18px 20px;
    border-radius: 26px; background: rgba(38, 39, 44, .96); border: 1px solid rgba(255,255,255,.08);
    box-shadow: 0 18px 50px rgba(0,0,0,.6);
  }
  .note .ic { flex: none; width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; }
  .note .tx { flex: 1; min-width: 0; }
  .note b { display: block; font-size: 20px; font-weight: 650; color: #f5f5f7; margin-bottom: 3px; }
  .note span { display: block; font-size: 19px; color: #a1a1a6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .note em { font-style: normal; font-size: 15px; color: #6e6e73; }
  .badge {
    width: 64px; height: 64px; border-radius: 50%; background: #ff453a; color: #fff;
    display: grid; place-items: center; font-size: 28px; font-weight: 700; box-shadow: 0 10px 30px rgba(255,69,58,.35);
  }

  /* ---------- App window ---------- */
  .win {
    position: absolute; width: 1560px; height: 800px; border-radius: 18px; overflow: hidden;
    background: #141518; border: 1px solid rgba(255,255,255,.1);
    box-shadow: 0 50px 140px rgba(0,0,0,.7), 0 0 0 1px rgba(0,0,0,.6);
  }
  .win * { position: absolute; }
  .win .tb { left: 0; top: 0; width: 1560px; height: 46px; background: #1a1b1e; border-bottom: 1px solid rgba(255,255,255,.06); }
  .win .tl { top: 17px; width: 12px; height: 12px; border-radius: 50%; }
  .win .ttl { left: 0; width: 1560px; top: 14px; text-align: center; font-size: 14px; color: #8e8e93; font-weight: 500; }
  .win .side { left: 0; top: 46px; width: 230px; height: 754px; background: #111214; border-right: 1px solid rgba(255,255,255,.06); }
  .win .nav { left: 14px; width: 202px; height: 40px; border-radius: 10px; font-size: 16px; color: #a1a1a6; font-weight: 500; }
  .win .nav.on { background: rgba(255,255,255,.08); color: #f5f5f7; }
  .win .nav svg { left: 12px; top: 11px; }
  .win .nav span { left: 44px; top: 10px; white-space: nowrap; }
  .win .hdr { font-size: 30px; font-weight: 700; letter-spacing: -0.03em; font-family: 'Inter Tight Variable'; white-space: nowrap; }
  .win .sub { font-size: 15px; color: #8e8e93; white-space: nowrap; }
  .win .hl { height: 1px; background: rgba(255,255,255,.06); }
  .win .vl { width: 1px; background: rgba(255,255,255,.06); }
  .win .tlab { font-size: 12px; color: #6e6e73; width: 50px; text-align: right; }
  .win .day { font-size: 14px; color: #8e8e93; font-weight: 500; white-space: nowrap; }
  .win .mtg {
    border-radius: 8px; background: #23252c; border-left: 3px solid #5d6273; overflow: hidden;
  }
  .win .mtg b, .win .task b { position: static; display: block; font-size: 14px; font-weight: 600; color: #e3e4ea; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .win .mtg em, .win .task em { position: static; display: block; font-style: normal; font-size: 12.5px; color: #8e8e93; margin-top: 2px; white-space: nowrap; }
  .win .mtg div, .win .task div { position: static; padding: 7px 10px; }
  .win .task { border-radius: 10px; overflow: hidden; border-left: 3px solid; }
  .win .task b { color: #fff; }
  .win .panel { left: 1240px; top: 46px; width: 320px; height: 754px; background: #111214; border-left: 1px solid rgba(255,255,255,.06); }
  .win .cta {
    left: 1256px; top: 716px; width: 288px; height: 56px; border-radius: 14px; background: var(--grad);
    color: #fff; font-size: 18px; font-weight: 650; overflow: hidden;
  }
  .win .cta span { left: 0; top: 0; width: 288px; height: 56px; line-height: 56px; text-align: center; white-space: nowrap; }
  .win .lbl * { position: static; }
  .scard .st, .scard .st * { position: static; }
  .win .now { height: 2px; background: #ff5f7e; }
  .win .now::before { content: ''; position: absolute; left: -5px; top: -4px; width: 10px; height: 10px; border-radius: 50%; background: #ff5f7e; }

  /* ---------- Focus scene ---------- */
  .fcard {
    width: 640px; height: 380px; border-radius: 34px; overflow: hidden;
    background: linear-gradient(150deg, #322a63 0%, #221d45 55%, #1a1733 100%);
    border: 1px solid rgba(170,150,255,.35); box-shadow: 0 40px 120px rgba(80,60,200,.35);
  }
  .invite {
    width: 340px; height: 88px; border-radius: 22px; display: flex; align-items: center; gap: 16px; padding: 0 20px;
    background: rgba(40,41,47,.97); border: 1px solid rgba(255,255,255,.1); box-shadow: 0 20px 50px rgba(0,0,0,.6);
  }
  .invite .av { width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 18px; color: #fff; flex: none; }
  .invite b { display: block; font-size: 21px; font-weight: 650; }
  .invite span { display: block; font-size: 16px; color: #a1a1a6; margin-top: 2px; }

  /* ---------- Summary scene (light) ---------- */
  .light { background: #f5f5f7; color: #1d1d1f; }
  .scard {
    width: 1120px; height: 690px; border-radius: 36px; background: #fff;
    box-shadow: 0 40px 100px rgba(0,0,0,.08), 0 0 0 1px rgba(0,0,0,.04);
  }
  .scard * { position: absolute; }
  .wbar { width: 7px; border-radius: 4px; background: linear-gradient(180deg, #9583ff, #d66bf5); }
  .sline { font-size: 25px; color: #1d1d1f; white-space: nowrap; letter-spacing: -0.01em; }
  .sline span { position: static; display: inline-block; white-space: pre; }
  .arow { height: 52px; width: 1040px; }
  .chk { width: 30px; height: 30px; border-radius: 50%; border: 2px solid #c7c7cc; top: 11px; left: 0; }
  .alab { left: 48px; top: 12px; font-size: 22px; font-weight: 500; color: #1d1d1f; white-space: nowrap; }
  .achip {
    right: 0; top: 6px; height: 40px; padding: 0 18px 0 44px; border-radius: 20px; background: #f2effe; color: #5b45e0;
    font-size: 17px; font-weight: 600; line-height: 40px; white-space: nowrap;
  }

  /* ---------- Devices ---------- */
  .lap-screen { width: 1120px; height: 700px; border-radius: 26px; background: #050506; border: 2px solid #2e2e33; overflow: hidden; }
  .lap-inner { position: absolute; left: 18px; top: 18px; width: 1080px; height: 660px; border-radius: 10px; overflow: hidden;
    background: radial-gradient(120% 90% at 20% 10%, #2a2160 0%, transparent 55%), radial-gradient(100% 80% at 90% 100%, #5a2a3c 0%, transparent 55%), #0d0d12; }
  .lap-base { width: 1300px; height: 28px; border-radius: 4px 4px 22px 22px; background: linear-gradient(180deg, #4a4a50 0%, #2a2a2e 45%, #161618 100%); }
  .phone { width: 340px; height: 700px; border-radius: 60px; background: #0a0a0b; border: 2px solid #3d3d42; box-shadow: 0 40px 100px rgba(0,0,0,.7); overflow: hidden; }
  .phone * { position: absolute; }
  .pscr { left: 10px; top: 10px; width: 316px; height: 676px; border-radius: 50px; background: #0f0f11; overflow: hidden; }
  .pitem { left: 64px; width: 232px; border-radius: 14px; border-left: 3px solid; overflow: hidden; }
  .pitem b { position: static; display: block; font-size: 15px; font-weight: 650; color: #fff; padding: 9px 12px 0; white-space: nowrap; }
  .pitem em { position: static; display: block; font-style: normal; font-size: 12.5px; color: #a1a1a6; padding: 2px 12px; white-space: nowrap; }
  .ptime { left: 14px; width: 42px; text-align: right; font-size: 11.5px; color: #6e6e73; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
// ============================================================================
// Kairo — 30s spot. Everything below is a pure function of time t (seconds),
// so any frame can be rendered independently: window.render(t).
// Music runs at 120 BPM (one beat = 0.5s, one bar = 2s); cuts land on beats.
// ============================================================================

const W = 1920, H = 1080, CX = 960, CY = 540;
const stage = document.getElementById('stage');

// ---------- math / easing ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const E = {
  lin: p => p,
  out2: p => 1 - (1 - p) * (1 - p),
  in2: p => p * p,
  out3: p => 1 - (1 - p) ** 3,
  in3: p => p * p * p,
  io3: p => p < .5 ? 4 * p * p * p : 1 - (-2 * p + 2) ** 3 / 2,
  out5: p => 1 - (1 - p) ** 5,
  outExpo: p => p >= 1 ? 1 : 1 - 2 ** (-10 * p),
  inExpo: p => p <= 0 ? 0 : 2 ** (10 * p - 10),
  ioExpo: p => p <= 0 ? 0 : p >= 1 ? 1 : p < .5 ? 2 ** (20 * p - 10) / 2 : (2 - 2 ** (-20 * p + 10)) / 2,
  outBack: p => { const c1 = 1.4, c3 = c1 + 1; return 1 + c3 * (p - 1) ** 3 + c1 * (p - 1) ** 2; },
  spring: p => p >= 1 ? 1 : 1 - Math.exp(-6.5 * p) * Math.cos(9.5 * p),
};
const P = (t, a, b, e = E.out3) => e(clamp((t - a) / (b - a)));
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const hex = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
const mix = (a, b, p) => { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], p))).join(',')})`; };

// ---------- dom helpers ----------
function el(tag, cls, parent, html, style) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  if (style) Object.assign(e.style, style);
  if (parent) parent.appendChild(e);
  return e;
}
function tf(e, o) {
  let s = `translate(${(o.x || 0).toFixed(2)}px,${(o.y || 0).toFixed(2)}px)`;
  if (o.rx) s += ` rotateX(${o.rx}deg)`;
  if (o.r) s += ` rotate(${o.r}deg)`;
  const k = o.s ?? 1;
  if (k !== 1) s += ` scale(${k})`;
  e.style.transform = s;
  if (o.o !== undefined) e.style.opacity = clamp(o.o);
  if (o.b !== undefined) e.style.filter = o.b > 0.1 ? `blur(${o.b.toFixed(2)}px)` : 'none';
}
const show = (e, on) => { e.style.display = on ? 'block' : 'none'; };

// ---------- icons ----------
let gid = 0;
function markSVG(size) {
  const id = 'kg' + (gid++);
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" style="display:block;overflow:visible">
    <defs><linearGradient id="${id}" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7d6bff"/><stop offset=".55" stop-color="#d66bf5"/><stop offset="1" stop-color="#ff8a5b"/></linearGradient></defs>
    <rect width="100" height="100" rx="27" fill="url(#${id})"/>
    <path class="arc" d="M50 25 A25 25 0 1 1 25 50" stroke="#fff" stroke-width="9" fill="none" stroke-linecap="round" stroke-dasharray="118" stroke-dashoffset="0"/>
    <circle class="dot" cx="33" cy="33" r="6.5" fill="#fff"/>
  </svg>`;
}
const SPARK = (s, c = '#fff') => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" style="display:inline-block;vertical-align:-0.12em"><path d="M12 1.5C12.7 8 16 11.3 22.5 12 16 12.7 12.7 16 12 22.5 11.3 16 8 12.7 1.5 12 8 11.3 11.3 8 12 1.5Z" fill="${c}"/></svg>`;
const CHECK = (s, c = '#fff', w = 3) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" style="display:block"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="${c}" stroke-width="${w}" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const ICON = {
  today: '<circle cx="9" cy="9" r="7" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M9 5v4l2.5 2" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/>',
  week: '<rect x="2" y="3" width="14" height="13" rx="3" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M2 7h14M6 1.5v3M12 1.5v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>',
  focus: '<path d="M14.5 11.5A6.5 6.5 0 0 1 6.5 3.5a6.5 6.5 0 1 0 8 8z" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linejoin="round"/>',
  meet: '<rect x="1.5" y="4.5" width="10" height="9" rx="2.5" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M11.5 8l5-3v8l-5-3" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linejoin="round"/>',
  tasks: '<rect x="2" y="2" width="14" height="14" rx="4" stroke="currentColor" stroke-width="1.6" fill="none"/><path d="M5.5 9l2.5 2.5 4.5-5" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/>',
  insights: '<path d="M3 15V9M9 15V3M15 15v-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>',
};
const ico = (k, s = 18) => `<svg width="${s}" height="${s}" viewBox="0 0 18 18">${ICON[k]}</svg>`;

// ============================================================================
// Product data — the week Kairo plans
// ============================================================================
const COL = ['Mon 6', 'Tue 7', 'Wed 8', 'Thu 9', 'Fri 10'];
const GX0 = 290, COLW = 188, GY0 = 176, HOUR = 68;
const slot = (c, h0, h1) => ({ x: GX0 + c * COLW + 4, y: GY0 + (h0 - 9) * HOUR + 2, w: COLW - 8, h: (h1 - h0) * HOUR - 4 });
const fmtH = h => { const hh = Math.floor(h), mm = Math.round((h - hh) * 60); const ap = hh >= 12 ? 'PM' : 'AM'; return `${((hh + 11) % 12) + 1}:${String(mm).padStart(2, '0')} ${ap}`; };
const fmtR = (a, b) => `${fmtH(a).replace(/ (AM|PM)/, '')} – ${fmtH(b)}`;
const MEETINGS = [
  [0, 9, 9.5, 'Standup'], [0, 13, 14, 'Design crit'], [1, 14, 15, 'Customer call'],
  [2, 9, 9.5, 'Standup'], [2, 11, 12, '1:1 · Marco'], [3, 15, 16, 'Hiring sync'],
  [4, 9, 9.5, 'Standup'], [4, 12, 13, 'Team lunch'], [3, 13, 13.5, 'Standup'],
];
const TASKS = [
  { name: 'Deep work · Roadmap', dur: '2h 30m', c: '#8b7bff', at: [1, 9.5, 12] },
  { name: 'Write launch post', dur: '1h 30m', c: '#e26bd9', at: [0, 10, 11.5] },
  { name: 'Review designs', dur: '1h', c: '#4f9bff', at: [2, 13, 14] },
  { name: 'Investor update', dur: '1h', c: '#ffb547', at: [3, 10, 11] },
  { name: 'Prep board deck', dur: '2h', c: '#ff7a59', at: [4, 14, 16] },
  { name: 'Gym', dur: '1h', c: '#3dd68c', at: [2, 17, 18] },
  { name: 'Inbox zero', dur: '30m', c: '#2fd4c7', at: [3, 9, 9.5] },
];
const PANEL = i => ({ x: 1256, y: 118 + i * 78, w: 288, h: 66 });

function buildApp(parent, planned) {
  const win = el('div', 'win', parent);
  const tb = el('div', 'tb', win);
  ['#ff5f57', '#febc2e', '#28c840'].forEach((c, i) => el('div', 'tl', tb, null, { left: 20 + i * 20 + 'px', background: c }));
  el('div', 'ttl', tb, 'Kairo');
  const side = el('div', 'side', win);
  el('div', null, side, markSVG(28), { left: '22px', top: '22px' });
  el('div', null, side, 'Kairo', { left: '60px', top: '24px', fontSize: '19px', fontWeight: 700, letterSpacing: '-0.02em' });
  [['today', 'Today'], ['week', 'Week'], ['focus', 'Focus'], ['meet', 'Meetings'], ['tasks', 'Tasks'], ['insights', 'Insights']].forEach(([k, n], i) => {
    const nv = el('div', 'nav' + (i === 1 ? ' on' : ''), side, `${ico(k)}<span>${n}</span>`, { top: 84 + i * 46 + 'px' });
  });
  el('div', null, side, '', { left: '22px', top: '686px', width: '36px', height: '36px', borderRadius: '50%', background: 'linear-gradient(135deg,#ffb547,#ff7a59)' });
  el('div', null, side, '<b style="position:static;display:block;font-size:15px;color:#f5f5f7;font-weight:600">Maya Chen</b><span style="position:static;display:block;font-size:13px;color:#8e8e93">Product Lead</span>', { left: '70px', top: '685px', whiteSpace: 'nowrap' });

  el('div', 'hdr', win, 'October 6 – 10', { left: '262px', top: '66px' });
  el('div', 'sub', win, 'Week 41 · 9 meetings', { left: '264px', top: '106px', display: 'none' });
  // header buttons
  el('div', null, win, '<span style="position:static">Today</span>', { left: '1000px', top: '68px', height: '36px', padding: '0 16px', lineHeight: '36px', borderRadius: '10px', border: '1px solid rgba(255,255,255,.12)', fontSize: '14px', color: '#d1d1d6', fontWeight: 500 });
  el('div', null, win, '<span style="position:static">‹ &nbsp; ›</span>', { left: '1086px', top: '68px', height: '36px', width: '64px', lineHeight: '35px', textAlign: 'center', borderRadius: '10px', border: '1px solid rgba(255,255,255,.12)', fontSize: '18px', color: '#d1d1d6' });
  el('div', null, win, '<span style="position:static">Week ▾</span>', { left: '1160px', top: '68px', height: '36px', width: '66px', lineHeight: '36px', textAlign: 'center', borderRadius: '10px', background: 'rgba(255,255,255,.08)', fontSize: '14px', color: '#f5f5f7', fontWeight: 500 });

  COL.forEach((d, i) => {
    const today = i === 1;
    const [dn, dd] = d.split(' ');
    el('div', 'day', win, `<span style="position:static;color:${today ? '#f5f5f7' : '#8e8e93'}">${dn}</span> <span style="position:static;display:inline-block;width:30px;height:30px;line-height:30px;text-align:center;border-radius:50%;margin-left:4px;${today ? 'background:linear-gradient(135deg,#9583ff,#d66bf5);color:#fff;font-weight:700' : 'color:#c7c7cc'}">${dd}</span>`, { left: GX0 + i * COLW + 12 + 'px', top: '132px' });
  });
  for (let h = 9; h <= 18; h++) {
    el('div', 'hl', win, null, { left: GX0 + 'px', top: GY0 + (h - 9) * HOUR + 'px', width: 5 * COLW + 'px' });
    if (h < 18) el('div', 'tlab', win, `${((h + 11) % 12) + 1} ${h >= 12 ? 'PM' : 'AM'}`, { left: '232px', top: GY0 + (h - 9) * HOUR - 7 + 'px' });
  }
  for (let c = 0; c <= 5; c++) el('div', 'vl', win, null, { left: GX0 + c * COLW + 'px', top: '124px', height: 800 - 124 + 'px' });
  MEETINGS.forEach(([c, a, b, n]) => {
    const s = slot(c, a, b);
    el('div', 'mtg', win, `<div><b>${n}</b>${b - a >= 1 ? `<em>${fmtR(a, b)}</em>` : ''}</div>`, { left: s.x + 'px', top: s.y + 'px', width: s.w + 'px', height: s.h + 'px' });
  });
  // now line (Tue, 10:40)
  const nowL = el('div', 'now', win, null, { left: GX0 + COLW + 'px', top: GY0 + (10.67 - 9) * HOUR + 'px', width: COLW + 'px' });

  // right panel
  const panel = el('div', 'panel', win);
  el('div', null, win, 'To plan', { left: '1260px', top: '68px', fontSize: '20px', fontWeight: 700, letterSpacing: '-0.01em' });
  const count = el('div', null, win, '7', { left: '1342px', top: '70px', height: '24px', minWidth: '24px', padding: '0 7px', lineHeight: '24px', textAlign: 'center', borderRadius: '12px', background: 'rgba(255,255,255,.1)', fontSize: '13px', fontWeight: 650, color: '#d1d1d6' });
