# fly.toml app configuration file generated for game-jyvnzq on 2026-08-01T10:41:11Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'game-jyvnzq'
primary_region = 'bom'

[build]

[env]
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 220
    soft_limit = 180

  [[http_service.checks]]
    interval = '30s'
    timeout = '4s'
    grace_period = '8s'
    method = 'GET'
    path = '/api/rooms'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
