<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Holdings</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%233ED6C0' stroke-width='3'/%3E%3C/svg%3E">
<meta name="theme-color" content="#05060A">
<!-- system fonts only — no external requests (privacy + reliability) -->

<style>
:root{
  --ink:#EAECEF;
  --muted:rgba(234,236,239,.6); --faint:rgba(234,236,239,.4); --ghost:rgba(234,236,239,.24);
  --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.16);
  --field:rgba(255,255,255,.05);
  --accent:#3ED6C0; --accent-ink:#04231F; --danger:#FF5A6E; --warn:#FFC53D;
  --card:rgba(16,19,26,.74);
  --r:18px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;-webkit-tap-highlight-color:transparent}
body{
  background:
    radial-gradient(1200px 700px at 50% -15%, rgba(62,214,192,.10), transparent 55%),
    radial-gradient(1000px 800px at 92% 115%, rgba(185,140,255,.10), transparent 55%),
    #05060A;
  color:var(--ink);
  font-family:system-ui,-apple-system,'SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  display:flex;align-items:center;justify-content:center;padding:18px;
}
.shell{width:100%;max-width:1000px;display:flex;flex-direction:column;gap:14px}

/* ── top bar ── */
.hud{display:flex;align-items:center;gap:14px;padding:0 4px;height:28px}
.brand{font-size:15px;font-weight:600;letter-spacing:-.02em;color:var(--muted);white-space:nowrap}
.brand b{color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.share{flex:1;display:flex;height:6px;border-radius:6px;overflow:hidden;background:rgba(255,255,255,.07);min-width:60px}
.share i{display:block;height:100%;transition:width .45s cubic-bezier(.3,1,.4,1)}
.timer{font-size:14px;font-weight:500;color:var(--faint);font-variant-numeric:tabular-nums;min-width:44px;text-align:right}

/* ── board ── */
.board{
  position:relative;border-radius:22px;overflow:hidden;
  background:#080B12;border:1px solid var(--line);
  box-shadow:0 40px 90px -40px rgba(0,0,0,.95), inset 0 1px 0 rgba(255,255,255,.04);
}
canvas{display:block;width:100%;height:auto;touch-action:none;cursor:crosshair}

/* ── countdown ── */
.count{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:6px;pointer-events:none;background:rgba(5,6,10,.45);backdrop-filter:blur(2px);z-index:3}
.count.on{display:flex}
.count-num{font-size:150px;font-weight:700;letter-spacing:-.04em;line-height:1;color:#fff;text-shadow:0 20px 60px rgba(0,0,0,.7)}
.count-num.pop{animation:cdpop .42s cubic-bezier(.2,.9,.3,1)}
@keyframes cdpop{from{transform:scale(1.35);opacity:0}to{transform:scale(1);opacity:1}}
.count-sub{font-size:15px;font-weight:500;color:var(--muted)}

/* ── banners (tutorial / pick) ── */
.layer{position:absolute;inset:0;display:none;z-index:2;pointer-events:none}
.layer.on{display:block}
.banner-top{position:absolute;top:16px;left:16px;right:16px;display:flex;gap:10px;align-items:flex-start}
.banner{flex:1;background:var(--card);border:1px solid var(--line-2);border-radius:14px;padding:13px 16px;font-size:14.5px;line-height:1.45;color:var(--ink);box-shadow:0 20px 50px -20px rgba(0,0,0,.8);backdrop-filter:blur(12px);pointer-events:auto;animation:rise .3s cubic-bezier(.2,.9,.3,1)}
.banner b{color:var(--accent)}
.banner-top .mini{pointer-events:auto;flex:none}
.done-cta{position:absolute;left:0;right:0;bottom:26px;display:none;justify-content:center}
.done-cta.on{display:flex}
.done-cta .btn{width:auto;pointer-events:auto}

/* ── overlay + panels ── */
.overlay{position:absolute;inset:0;display:none;place-items:center;padding:20px;background:rgba(5,6,10,.24);z-index:4}
.overlay.on{display:grid}
.panel{
  display:none;width:100%;max-width:400px;padding:32px 28px;
  background:rgba(13,16,24,.9);border:1px solid rgba(255,255,255,.13);border-radius:22px;
  box-shadow:0 40px 100px -24px rgba(0,0,0,.95), 0 0 70px -24px rgba(62,214,192,.28), inset 0 1px 0 rgba(255,255,255,.07);
  backdrop-filter:blur(16px);
  animation:rise .34s cubic-bezier(.2,.9,.3,1);
}
.panel.on{display:block}
@keyframes rise{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}

.logo{font-size:33px;font-weight:700;letter-spacing:-.035em;margin:0 0 6px;text-align:center}
.tag{margin:0 0 24px;font-size:15px;color:var(--muted);line-height:1.5;text-align:center}
.panel h2{font-size:27px;font-weight:700;letter-spacing:-.03em;margin:0 0 8px;text-align:center}
.panel .lead{margin:0 0 22px;font-size:15px;color:var(--muted);line-height:1.5;text-align:center}
.err{color:var(--danger);font-size:13.5px;min-height:18px;margin:12px 0 0;text-align:center}
.how{margin:20px 0 0;font-size:12.5px;line-height:1.55;color:var(--faint);text-align:center}

/* ── controls ── */
.btn{display:block;width:100%;font-family:inherit;font-size:16px;font-weight:590;letter-spacing:-.01em;border:1px solid transparent;border-radius:14px;padding:14px 18px;cursor:pointer;transition:transform .12s ease, background .15s, border-color .15s, color .15s, box-shadow .15s, opacity .15s}
.btn+.btn{margin-top:10px}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.45;cursor:default}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 12px 30px -12px rgba(62,214,192,.8)}
.btn.primary:hover{background:#4fe0cb}
.btn.tinted{background:rgba(255,255,255,.08);color:var(--ink);border-color:var(--line-2)}
.btn.tinted:hover{background:rgba(255,255,255,.12)}
.btn.ghost{background:transparent;color:var(--muted);border-color:var(--line-2)}
.btn.ghost:hover{color:var(--ink);border-color:rgba(255,255,255,.3)}
.btn.ready-on{background:rgba(62,214,192,.16);color:var(--accent);border-color:rgba(62,214,192,.5)}
.btn.link{background:none;border:none;color:var(--accent);font-size:14px;font-weight:500;padding:10px;width:auto;margin:4px auto 0}
.btn.link:hover{text-decoration:underline}

.field{font-family:inherit;font-size:16px;font-weight:500;color:var(--ink);background:var(--field);border:1px solid var(--line-2);border-radius:14px;padding:14px 16px;width:100%;outline:none;transition:border-color .15s, background .15s, box-shadow .15s}
.field:focus{border-color:var(--accent);background:rgba(255,255,255,.07);box-shadow:0 0 0 4px rgba(62,214,192,.14)}
.field::placeholder{color:var(--ghost)}
#name{margin-bottom:14px}
.join{display:flex;gap:8px}
.join .field{flex:1}
.join .btn{width:auto;padding:14px 22px}
#code{text-transform:uppercase;letter-spacing:.3em;text-align:center;font-weight:600}

.divider{display:flex;align-items:center;gap:12px;margin:18px 0 14px;color:var(--faint);font-size:12.5px}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}

.code-badge{font-size:46px;font-weight:700;letter-spacing:.14em;padding-left:.14em;text-align:center;color:var(--accent);margin:0 0 4px;cursor:pointer}
.sub{font-size:13px;color:var(--faint);text-align:center;margin:0 0 22px}
.seats{display:flex;flex-direction:column;gap:8px;margin:0 0 18px;text-align:left}
.seat{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:13px;background:rgba(255,255,255,.04);border:1px solid transparent;font-size:14.5px}
.seat.mine{border-color:var(--line-2);background:rgba(255,255,255,.06)}
.seat .dot{width:11px;height:11px;border-radius:50%;flex:none;box-shadow:0 0 10px -1px currentColor}
.seat .who{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:450}
.seat .badge{font-size:11.5px;font-weight:600;color:var(--faint);white-space:nowrap}
.seat .badge.on{color:var(--accent)}
.seat .badge.away{color:var(--warn)}
.seat.empty{opacity:.55}
.lobby-foot{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:16px}
.waitMsg{font-size:12.5px;color:var(--faint);text-align:center;min-height:15px}

/* ── legend ── */
.legend{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted);padding:0 4px}
.legend .p{display:flex;align-items:center;gap:7px}
.legend .dot{width:9px;height:9px;border-radius:50%}
.legend .n{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:500}
.legend .me{color:var(--ink);font-weight:600}
.hint{margin-left:auto;color:var(--faint)}
.hint.warn{color:var(--warn)}

.mini{font-family:inherit;font-size:13px;font-weight:500;letter-spacing:-.01em;padding:7px 14px;border-radius:10px;background:rgba(255,255,255,.05);color:var(--muted);border:1px solid var(--line-2);cursor:pointer;transition:color .15s,border-color .15s,background .15s}
.mini:hover{color:var(--ink);border-color:rgba(255,255,255,.3)}
.mini.armed{color:var(--danger);border-color:rgba(255,90,110,.55)}

@media (max-width:620px){
  .logo{font-size:28px}.panel h2{font-size:23px}
  .code-badge{font-size:38px}.count-num{font-size:104px}
  .panel{padding:26px 22px}
}
</style>

<div class="shell">
  <div class="hud">
    <span class="brand" id="hudTitle">Holdings</span>
    <div class="share" id="share"></div>
    <span class="timer" id="timer">0:00</span>
    <button class="mini" id="restart" type="button" style="display:none">Restart</button>
    <button class="mini" id="leave" type="button" style="display:none">Leave</button>
  </div>

  <div class="board" id="board">
    <canvas id="game" width="1000" height="640"></canvas>

    <div class="layer" id="tut">
      <div class="banner-top">
        <div class="banner" id="tutMsg"></div>
        <button class="mini" id="tutSkip" type="button">Skip</button>
      </div>
      <div class="done-cta" id="tutDone"><button class="btn primary" id="tutPlay" type="button">Play for real</button></div>
    </div>

    <div class="layer" id="pick">
      <div class="banner-top"><div class="banner" id="pickMsg"></div></div>
    </div>

    <div class="count" id="count">
      <div class="count-num" id="countNum">3</div>
      <div class="count-sub" id="countSub">Get ready</div>
    </div>

    <div class="overlay on" id="ov">

      <!-- ── menu ── -->
      <div class="panel on" id="p-menu">
        <h1 class="logo">Holdings</h1>
        <p class="tag">Send half a circle's troops to take the ones beside it. Hold the whole map to win.</p>
        <input id="name" class="field" maxlength="18" placeholder="Your name" autocomplete="off">
        <button id="btnPlay" class="btn primary" type="button">Play solo</button>
        <button id="btnCreate" class="btn tinted" type="button">Create a room</button>
        <div class="divider"><span id="orRow">or join with a code</span></div>
        <div class="join">
          <input id="code" class="field" maxlength="4" placeholder="CODE" autocomplete="off" spellcheck="false">
          <button class="btn ghost" id="btnJoin" type="button">Join</button>
        </div>
        <p class="err" id="menuErr"></p>
        <button id="btnTut" class="btn link" type="button">How to play</button>
      </div>

      <!-- ── lobby ── -->
      <div class="panel" id="p-room">
        <div class="code-badge" id="roomCode" title="Tap to copy">····</div>
        <p class="sub">Share this code so friends can join</p>
        <div class="seats" id="seats"></div>
        <button id="btnStart" class="btn primary" type="button">Start</button>
        <button id="btnReady" class="btn tinted" type="button" style="display:none">I'm ready</button>
        <p class="err" id="roomErr"></p>
        <div class="lobby-foot">
          <button class="btn ghost" id="btnCopy" type="button">Copy invite link</button>
          <span class="waitMsg" id="waitMsg"></span>
        </div>
      </div>

      <!-- ── result ── -->
      <div class="panel" id="p-over">
        <h2 id="overT">The map is yours</h2>
        <p class="lead" id="overP"></p>
        <button id="btnAgain" class="btn primary" type="button">Play again</button>
        <div class="lobby-foot"><span class="waitMsg" id="againMsg">&nbsp;</span></div>
      </div>

    </div>
  </div>

  <div class="legend" id="legend"></div>
</div>

<script>
(function(){
"use strict";

const W = 1000, H = 640;
const SEND_FRACTION = 0.5;
const TROOP_SPEED   = 132;
const TROOP_GAP     = TROOP_SPEED * 0.028;
const PRED_TTL      = 12000;   /* safety cap; a column normally retires when it lands */
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;

const FACTIONS = [
  { name:"Teal",    main:"#3ED6C0", dim:"#0E332E", glow:"62,214,192" },
  { name:"Crimson", main:"#FF5A6E", dim:"#38151B", glow:"255,90,110" },
  { name:"Amber",   main:"#FFC53D", dim:"#372B10", glow:"255,197,61" },
  { name:"Violet",  main:"#B98CFF", dim:"#271F3C", glow:"185,140,255" },
  { name:"Lime",    main:"#8BE04E", dim:"#1F3115", glow:"139,224,78" }
];
const NEUTRAL = { name:"Free", main:"#78838F", dim:"#171B21", glow:"120,131,143" };
const paint = o => (o == null || o < 0 ? NEUTRAL : FACTIONS[o]);

const cv  = document.getElementById("game");
const ctx = cv.getContext("2d");
const $   = id => document.getElementById(id);
const nameVal = () => $("name").value.trim();

const net = { code:null, pid:null, seat:null, host:false, hostPid:null, phase:"menu",
              roster:[], es:null, ok:true, owner:false, solo:false, ready:false, winner:null, cdEnd:0 };
const G = { nodes: [], links: [], flights: new Map(), elapsed: 0, started: false, seed: null };
let pending = [];
let cid = 0;
let view = { c: [], ghosts: [] };
let sel = [], dragging = false, px = 0, py = 0;

/* ── pre-rendered sprites — drawImage each frame instead of building a radial
   gradient per circle (and a 3-gradient starfield) every frame ── */
const glowSprite = FACTIONS.map(f => {
  const c = document.createElement("canvas"); c.width = c.height = 128;
  const g = c.getContext("2d");
  const grd = g.createRadialGradient(64, 64, 12, 64, 64, 64);
  grd.addColorStop(0, "rgba(" + f.glow + ",.22)"); grd.addColorStop(1, "rgba(" + f.glow + ",0)");
  g.fillStyle = grd; g.fillRect(0, 0, 128, 128);
  return c;
});
const stars = [];
for (let i = 0; i < 320; i++) stars.push({
  x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.7 + 0.4,
  a: Math.random() * 0.55 + 0.35, p: Math.random() * 6.28, s: Math.random() * 0.7 + 0.35
});
let skyCanvas = null;
function buildSky(){
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  const g = c.getContext("2d");
  const grad = g.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, "#0C1122"); grad.addColorStop(1, "#05060A");
  g.fillStyle = grad; g.fillRect(0, 0, W, H);
  const neb = (x, y, r, rgb, a) => {
    const rg = g.createRadialGradient(x, y, 0, x, y, r);
    rg.addColorStop(0, "rgba(" + rgb + "," + a + ")"); rg.addColorStop(1, "rgba(" + rgb + ",0)");
    g.fillStyle = rg; g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
  };
  neb(280, 165, 380, "62,214,192", .11); neb(775, 490, 420, "150,110,255", .13); neb(560, 300, 320, "255,197,61", .05);
  for (const st of stars){ g.globalAlpha = st.a; g.fillStyle = "#fff"; g.beginPath(); g.arc(st.x, st.y, st.r, 0, Math.PI * 2); g.fill(); }
  g.globalAlpha = 1;
  skyCanvas = c;
}
function drawSky(t){
  if (!skyCanvas) buildSky();
  ctx.drawImage(skyCanvas, 0, 0);
  if (!REDUCED) for (let i = 0; i < 44; i++){        /* a few live twinklers over the cached field */
    const st = stars[(i * 7) % stars.length];
    ctx.globalAlpha = st.a * (0.5 + 0.5 * Math.sin(t * st.s + st.p));
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(st.x, st.y, st.r + .4, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

/* ══════════════════════════════════════════════════════════════
   Talking to the server
   ══════════════════════════════════════════════════════════════ */
const sleep = ms => new Promise(r => setTimeout(r, ms));
const RETRYABLE = /closed|not in this room|no room with that code|server error/i;
async function api(action, extra){
  const body = Object.assign({ action, code: net.code, pid: net.pid }, extra || {});
  let last = { ok:false, error:"Cannot reach the server." };
  for (let attempt = 0; attempt < 5; attempt++){
    if (attempt) await sleep(150 * attempt);
    try {
      const r = await fetch("/api/cmd", { method:"POST", headers:{ "content-type":"application/json" }, body: JSON.stringify(body) });
      if (r.status === 429) return { ok:false, error:"Slow down a moment." };
      const j = await r.json();
      if (j.ok || !RETRYABLE.test(j.error || "")) return j;
      last = j;
    } catch (e){ last = { ok:false, error:"Cannot reach the server." }; }
  }
  return last;
}

let reAttempts = 0, reTimer = 0;
function connect(){
  if (net.es) net.es.close();
  const es = new EventSource("/api/stream?code=" + net.code + "&pid=" + net.pid);
  net.es = es;
  es.addEventListener("hello",  () => { net.ok = true; paintHud(); });
  es.addEventListener("lobby",  e => onLobby(JSON.parse(e.data)));
  es.addEventListener("init",   e => onInit(JSON.parse(e.data)));
  es.addEventListener("state",  e => onState(JSON.parse(e.data)));
  es.onopen  = () => { net.ok = true; reAttempts = 0; paintHud(); };
  es.onerror = () => {
    net.ok = false; paintHud();
    if (es.readyState === 2 && net.code && reAttempts < 12){
      reAttempts++; clearTimeout(reTimer);
      reTimer = setTimeout(() => { if (net.es === es && net.code) connect(); }, Math.min(3000, 400 * reAttempts));
    }
  };
}

function onLobby(d){
  const wasPhase = net.phase;
  net.phase   = d.phase;
  net.host    = d.host === net.pid;
  net.hostPid = d.host;
  net.roster  = d.players;
  const me = d.players.find(p => p.pid === net.pid);
  net.seat  = me ? me.seat : null;
  net.ready = me ? !!me.ready : false;
  net.winner = d.winner;
  if (d.phase === "countdown" && (wasPhase !== "countdown" || !net.cdEnd)) net.cdEnd = performance.now() + (d.countdownMs || 0);
  paintRoom(); paintPick(); paintHud(); showStage();
}

function onInit(d){
  /* a reconnect (or the pick→countdown re-send) carries the same map — keep the
     board we already have instead of wiping it, so it doesn't flash/reload */
  const same = G.seed === d.seed && G.nodes.length === d.nodes.length;
  const prev = same ? G.nodes : null;
  G.seed = d.seed;
  G.nodes = d.nodes.map((a, i) => ({
    x:a[0], y:a[1], r:a[2], tier:a[3], home:!!a[4], candidate:!!a[5],
    owner: prev ? prev[i].owner : null, count: prev ? prev[i].count : 0, pulse:0, flash:0
  }));
  G.links = d.links;
  if (!same) G.flights.clear();
  pending = [];
  G.started = true;
  net.seat = d.seat;
  paintHud();
}

function onState(d){
  if (net.phase === "tutorial" || !G.nodes.length) return;
  if (d.ack > cid) cid = d.ack;   /* stay ahead of the server after a reload */
  for (let i = 0; i < G.nodes.length; i++){
    const n = G.nodes[i];
    const owner = d.n[i*2] < 0 ? null : d.n[i*2];
    const count = d.n[i*2+1];
    if (owner !== n.owner) n.pulse = 1;
    else if (count < n.count) n.flash = 1;
    n.owner = owner; n.count = count;
  }
  const seen = new Set();
  for (const a of d.f){
    const id = a[0]; seen.add(id);
    let fl = G.flights.get(id);
    if (!fl){ fl = { id, from:a[1], to:a[2], owner:a[3], count:a[4], delivered:a[5], prog:a[6] }; G.flights.set(id, fl); }
    else { fl.delivered = a[5]; const drift = a[6] - fl.prog; fl.prog += Math.abs(drift) > 40 ? drift : drift * 0.35; }
  }
  for (const id of [...G.flights.keys()]) if (!seen.has(id)) G.flights.delete(id);
  G.elapsed = d.t;
  if (net.phase === "pick") paintPick();
}

/* ── orders — drawn instantly and locally, then reconciled ──────────────────
   Each order animates its own predicted column right away, so the drag feels
   immediate no matter the network. The server's echo of that same column is
   hidden (see render) so an order never shows two columns; the prediction is
   retired once its column has visually landed. ── */
function issue(from, to){
  if (!from.length) return;
  const t = G.nodes[to];
  if (!t) return;
  const id = ++cid;
  const legs = [];
  for (const s of from){
    const n = G.nodes[s];
    if (!n || n.owner !== net.seat || s === to) continue;
    const base = view.c[s] != null ? view.c[s] : n.count;
    const k = Math.floor(base * SEND_FRACTION);
    if (k < 1) continue;
    legs.push({ from:s, k, len: Math.max(8, Math.hypot(t.x - n.x, t.y - n.y) - n.r - t.r * 0.82) });
  }
  if (!legs.length) return;
  pending.push({ cid:id, to, legs, t0: performance.now() });
  api("send", { from, to, cid:id });
}
function rebuild(){
  const now = performance.now();
  const c = G.nodes.map(n => n.count);
  const ghosts = [];
  const alive = [];
  for (const p of pending){
    if (now - p.t0 > PRED_TTL) continue;
    const prog = (now - p.t0) / 1000 * TROOP_SPEED;
    let moving = false;
    for (const leg of p.legs){
      const lastArrive = leg.len + (leg.k - 1) * TROOP_GAP;
      if (prog <= lastArrive + 24){               /* still in flight → predict it */
        if (c[leg.from] != null) c[leg.from] = Math.max(0, c[leg.from] - leg.k);
        ghosts.push({ from:leg.from, to:p.to, owner:net.seat, count:leg.k, delivered:0, prog, len:leg.len });
        moving = true;
      }
    }
    if (moving) alive.push(p);                     /* landed → let the server's count stand */
  }
  pending = alive;
  view = { c, ghosts };
}

/* ══════════════════════════════════════════════════════════════
   Input
   ══════════════════════════════════════════════════════════════ */
function pos(e){
  const r = cv.getBoundingClientRect();
  return { x:(e.clientX - r.left) / r.width * W, y:(e.clientY - r.top) / r.height * H };
}
function nodeAt(p){
  for (let i = 0; i < G.nodes.length; i++){
    const n = G.nodes[i];
    if (Math.hypot(n.x - p.x, n.y - p.y) < n.r + 8) return i;
  }
  return -1;
}
const canPlay = () => (net.phase === "live" || net.phase === "tutorial") && net.seat !== null;
const iPicked = () => G.nodes.some(n => n.candidate && n.owner === net.seat);

cv.addEventListener("pointerdown", e => {
  const p = pos(e); px = p.x; py = p.y;
  if (net.phase === "pick"){
    if (net.seat === null || iPicked()) return;
    const i = nodeAt(p);
    if (i >= 0 && G.nodes[i].candidate && G.nodes[i].owner === null){
      G.nodes[i].owner = net.seat; G.nodes[i].count = 22; G.nodes[i].pulse = 1;  /* optimistic */
      paintPick();
      api("pick", { node:i });
    }
    return;
  }
  if (!canPlay()) return;
  cv.setPointerCapture(e.pointerId);
  const i = nodeAt(p);
  sel = [];
  if (i >= 0 && G.nodes[i].owner === net.seat){ sel.push(i); dragging = true; }
});
cv.addEventListener("pointermove", e => {
  const p = pos(e); px = p.x; py = p.y;
  if (!dragging) return;
  const i = nodeAt(p);
  if (i >= 0 && G.nodes[i].owner === net.seat && sel.indexOf(i) < 0) sel.push(i);
});
function release(){
  if (dragging){
    const t = nodeAt({ x:px, y:py });
    if (t >= 0){
      const from = sel.filter(s => s !== t);
      if (net.phase === "tutorial") tutSend(from, t); else issue(from, t);
    }
  }
  dragging = false; sel = [];
}
cv.addEventListener("pointerup", release);
cv.addEventListener("pointercancel", release);
cv.addEventListener("contextmenu", e => e.preventDefault());

/* ══════════════════════════════════════════════════════════════
   Render
   ══════════════════════════════════════════════════════════════ */
function drawColumn(fl){
  const a = G.nodes[fl.from], b = G.nodes[fl.to];
  if (!a || !b) return;
  const c = FACTIONS[fl.owner];
  const ang = Math.atan2(b.y - a.y, b.x - a.x);
  const ux = Math.cos(ang), uy = Math.sin(ang);
  const nx = -uy, ny = ux;
  ctx.fillStyle = c.main;
  for (let i = fl.delivered; i < fl.count; i++){
    const arc = fl.prog - i * TROOP_GAP;
    if (arc < 0) break;
    if (arc >= fl.len) continue;
    const off = (i % 5 - 2) * 4.5;
    const d = a.r + arc;
    ctx.beginPath();
    ctx.arc(a.x + ux * d + nx * off, a.y + uy * d + ny * off, 3.1, 0, Math.PI * 2);
    ctx.fill();
  }
}

function render(){
  const t = performance.now();
  if (!G.nodes.length){ drawSky(t / 1000); return; }
  ctx.clearRect(0, 0, W, H);

  ctx.strokeStyle = "rgba(255,255,255,.05)";
  ctx.lineWidth = 1;
  for (const l of G.links){
    const a = G.nodes[l[0]], b = G.nodes[l[1]];
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }

  if (dragging && sel.length){
    const tg = nodeAt({ x:px, y:py });
    const mine = FACTIONS[net.seat] || FACTIONS[0];
    ctx.setLineDash([5, 7]); ctx.lineWidth = 2;
    for (const s of sel){
      const a = G.nodes[s];
      ctx.strokeStyle = (tg >= 0 && tg !== s) ? mine.main : "rgba(" + mine.glow + ",.35)";
      ctx.beginPath(); ctx.moveTo(a.x, a.y);
      ctx.lineTo(tg >= 0 ? G.nodes[tg].x : px, tg >= 0 ? G.nodes[tg].y : py); ctx.stroke();
    }
    ctx.setLineDash([]);
    if (tg >= 0){
      const n = G.nodes[tg];
      ctx.strokeStyle = mine.main; ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.arc(n.x, n.y, n.r + 9, 0, Math.PI * 2); ctx.stroke();
    }
  }

  const picking = net.phase === "pick";
  for (let i = 0; i < G.nodes.length; i++){
    const n = G.nodes[i];
    const c = paint(n.owner);
    const owned = n.owner !== null;
    const pickable = picking && n.candidate && !owned;

    if (owned){
      const R = n.r * 2.5;
      ctx.drawImage(glowSprite[n.owner], n.x - R, n.y - R, R * 2, R * 2);
    }
    if (pickable){
      const tw = REDUCED ? 1 : 0.5 + 0.5 * Math.sin(t / 360 + i);
      ctx.strokeStyle = "rgba(62,214,192," + (0.3 + 0.45 * tw) + ")";
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(n.x, n.y, n.r + 7 + tw * 5, 0, Math.PI * 2); ctx.stroke();
    }
    if (n.pulse > 0 && !REDUCED){
      ctx.strokeStyle = "rgba(" + c.glow + "," + (n.pulse * .5) + ")";
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(n.x, n.y, n.r + (1 - n.pulse) * 26, 0, Math.PI * 2); ctx.stroke();
    }

    ctx.fillStyle = c.dim;
    ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2); ctx.fill();

    ctx.strokeStyle = pickable ? "rgba(62,214,192,.6)" : c.main;
    ctx.lineWidth = n.home ? 3.4 : 2.2;
    ctx.globalAlpha = (owned || pickable) ? 1 : .55;
    ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;

    if (n.tier === 2 && !n.home && !pickable){
      ctx.globalAlpha = owned ? .55 : .3; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.arc(n.x, n.y, n.r - 6, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    if (n.home){
      ctx.fillStyle = c.main; ctx.globalAlpha = .16;
      ctx.beginPath(); ctx.arc(n.x, n.y, n.r - 5, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
    if (n.flash > 0){
      ctx.fillStyle = "rgba(255,255,255," + (n.flash * .3) + ")";
      ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2); ctx.fill();
    }
    if (sel.indexOf(i) >= 0){
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(n.x, n.y, n.r + 6, 0, Math.PI * 2); ctx.stroke();
    }

    if (!pickable){
      ctx.fillStyle = owned ? "#fff" : "rgba(234,236,239,.72)";
      ctx.font = "600 " + (n.home ? 19 : n.tier === 2 ? 17 : n.tier === 1 ? 15 : 13) + "px system-ui, sans-serif";
      ctx.textAlign = "center"; ctx.textBaseline = "middle";
      ctx.fillText(String(Math.max(0, view.c[i] != null ? view.c[i] : n.count)), n.x, n.y + 1);
    }
  }
  ctx.textAlign = "left"; ctx.textBaseline = "alphabetic";

  /* draw the server's columns, but hide its echo of the orders we're already
     predicting — that duplicate, delayed by the round-trip, was the "travels
     twice" effect. Our own predicted columns are drawn on top. */
  const mineInFlight = new Set();
  for (const p of pending) for (const leg of p.legs) mineInFlight.add(leg.from + ">" + p.to);
  for (const fl of G.flights.values()){
    if (fl.owner === net.seat && mineInFlight.has(fl.from + ">" + fl.to)) continue;
    drawColumn(fl);
  }
  for (const g of view.ghosts) drawColumn(g);
}

/* ══════════════════════════════════════════════════════════════
   Interactive tutorial — a tiny local match, no server
   ══════════════════════════════════════════════════════════════ */
const TUT = { flights: [], nextId: 1, step: 0 };
const TUT_STEPS = [
  { msg: "This teal circle is your base. <b>Drag from it onto the grey circle</b> to send half its troops.", done: () => G.nodes[1] && G.nodes[1].owner === 0 },
  { msg: "Nice — you took it, and circles you own slowly grow. Now <b>take the red base</b>. Drag from both of your circles at once if you need more troops.", done: () => G.nodes[2] && G.nodes[2].owner === 0 },
  { msg: "That's the whole game: send, capture, and hold everything to win. You're ready.", done: null }
];
function tutBoard(){
  G.nodes = [
    { x:250, y:430, r:31, tier:2, home:true,  candidate:false, owner:0,    count:24, acc:0, cap:99, growth:1.3, pulse:0, flash:0 },
    { x:505, y:295, r:24, tier:1, home:false, candidate:false, owner:null, count:9,  acc:0, cap:60, growth:0.7, pulse:0, flash:0 },
    { x:760, y:225, r:30, tier:2, home:true,  candidate:false, owner:1,    count:10, acc:0, cap:99, growth:0.5, pulse:0, flash:0 }
  ];
  G.links = [[0,1],[1,2],[0,2]];
  G.flights.clear();
  TUT.flights = []; TUT.nextId = 1; TUT.step = 0;
  G.started = true; net.seat = 0;
}
function tutSend(from, to){
  for (const s of from){
    const n = G.nodes[s];
    if (!n || n.owner !== 0 || s === to) continue;
    const k = Math.floor(n.count * SEND_FRACTION);
    if (k < 1) continue;
    n.count -= k;
    const t = G.nodes[to];
    TUT.flights.push({ id: TUT.nextId++, from:s, to, owner:0, count:k, delivered:0, prog:0, len: Math.max(8, Math.hypot(t.x - n.x, t.y - n.y) - n.r - t.r * 0.82) });
  }
}
function tutTick(dt){
  for (const n of G.nodes){
    if (n.owner === null || n.count >= n.cap) continue;
    n.acc += n.growth * dt;
    while (n.acc >= 1){ n.acc -= 1; n.count = Math.min(n.cap, n.count + 1); }
  }
  for (let i = TUT.flights.length - 1; i >= 0; i--){
    const fl = TUT.flights[i];
    fl.prog += TROOP_SPEED * dt;
    while (fl.delivered < fl.count && fl.prog - fl.delivered * TROOP_GAP >= fl.len){
      const n = G.nodes[fl.to];
      if (n.owner === fl.owner) n.count = Math.min(n.cap, n.count + 1);
      else if (n.count > 0){ n.count--; n.flash = 1; }
      else { n.owner = fl.owner; n.count = 1; n.pulse = 1; }
      fl.delivered++;
    }
    if (fl.delivered >= fl.count) TUT.flights.splice(i, 1);
  }
  G.flights.clear();
  for (const fl of TUT.flights) G.flights.set(fl.id, fl);
  const s = TUT_STEPS[TUT.step];
  if (s && s.done && s.done()){
    TUT.step++;
    const nx = TUT_STEPS[TUT.step];
    if (nx){ $("tutMsg").innerHTML = nx.msg; if (!nx.done) $("tutDone").classList.add("on"); }
  }
}
function startTutorial(){
  net.phase = "tutorial"; net.code = null; net.owner = false; net.solo = false;
  pending = []; view = { c:[], ghosts:[] };
  tutBoard();
  $("tutMsg").innerHTML = TUT_STEPS[0].msg;
  $("tutDone").classList.remove("on");
  showStage(); paintHud();
}
function exitTutorial(){
  $("tut").classList.remove("on"); $("tutDone").classList.remove("on");
  net.phase = "menu"; net.seat = null;
  G.nodes = []; G.links = []; G.flights.clear(); TUT.flights = [];
}

/* ══════════════════════════════════════════════════════════════
   Chrome — HUD, legend, panels
   ══════════════════════════════════════════════════════════════ */
const shareEl = $("share"), legendEl = $("legend");
const bars = [], counts = [], names = [];
function buildHud(){
  shareEl.textContent = ""; legendEl.textContent = "";
  bars.length = counts.length = names.length = 0;
  for (let i = 0; i < FACTIONS.length; i++){
    const b = document.createElement("i"); b.style.background = FACTIONS[i].main; b.style.width = "0%";
    shareEl.appendChild(b); bars.push(b);
    const p = document.createElement("span"); p.className = "p";
    const d = document.createElement("span"); d.className = "dot"; d.style.background = FACTIONS[i].main; d.style.color = FACTIONS[i].main;
    const nm = document.createElement("span"); nm.textContent = FACTIONS[i].name;
    const num = document.createElement("span"); num.className = "n"; num.textContent = "0";
    p.append(d, nm, num); legendEl.appendChild(p);
    counts.push(num); names.push(nm);
  }
  const hint = document.createElement("span");
  hint.className = "hint"; hint.id = "hint"; hint.textContent = "drag from yours onto anything";
  legendEl.appendChild(hint);
}
function seatName(seat){
  const p = net.roster.find(x => x.seat === seat);
  if (!p) return "AI";
  return p.live ? p.name : p.name + " (away)";
}
function paintHud(){
  const title = net.code ? "Holdings &middot; <b>" + net.code + "</b>" : "Holdings";
  if ($("hudTitle").innerHTML !== title) $("hudTitle").innerHTML = title;
  $("restart").style.display = (net.host && net.phase === "live") ? "" : "none";
  $("leave").style.display   = net.code ? "" : "none";
  for (let i = 0; i < FACTIONS.length; i++){
    const label = seatName(i), cls = i === net.seat ? "me" : "";
    if (names[i].textContent !== label) names[i].textContent = label;
    if (names[i].className !== cls) names[i].className = cls;
  }
  const hint = $("hint");
  if (hint){
    const wipedOut = net.phase === "live" && net.seat !== null && G.started && G.nodes.length &&
                     G.nodes.some(n => n.owner !== null) && !G.nodes.some(n => n.owner === net.seat) &&
                     ![...G.flights.values()].some(f => f.owner === net.seat);
    const set = (txt, cls) => { if (hint.textContent !== txt){ hint.textContent = txt; hint.className = cls; } };
    if (net.phase === "tutorial")                      { set("tutorial", "hint"); }
    else if (net.phase === "pick")                     { set("choose your start", "hint"); }
    else if (!net.ok)                                  { set("reconnecting…", "hint warn"); }
    else if (wipedOut)                                 { set("you are out — watching", "hint warn"); }
    else if (net.phase === "live" && net.seat === null){ set("spectating", "hint"); }
    else                                               { set("drag from yours onto anything", "hint"); }
  }
}
let hudT = 0;
function hud(dt){
  hudT += dt;
  if (hudT < .18) return;
  hudT = 0;
  const total = G.nodes.length || 1;
  for (let i = 0; i < FACTIONS.length; i++){
    const held = G.nodes.filter(n => n.owner === i).length;
    bars[i].style.width = (held / total * 100) + "%";
    counts[i].textContent = String(held);
  }
  $("timer").textContent = fmt(G.elapsed);
  paintHud();
}
const fmt = s => Math.floor(s / 60) + ":" + String(Math.floor(s % 60)).padStart(2, "0");

function showPanel(id){
  const ov = $("ov");
  for (const p of document.querySelectorAll(".panel")) p.classList.remove("on");
  if (!id){ ov.classList.remove("on"); return; }
  ov.classList.add("on"); $(id).classList.add("on");
}
function showStage(){
  const p = net.phase;
  const bare = p === "menu";   /* the start screen is just space + the card */
  $("share").style.visibility  = bare ? "hidden" : "visible";
  $("timer").style.visibility  = bare ? "hidden" : "visible";
  $("legend").style.visibility = bare ? "hidden" : "visible";
  $("count").classList.toggle("on", p === "countdown" || (net.solo && p === "lobby"));
  $("tut").classList.toggle("on", p === "tutorial");
  $("pick").classList.toggle("on", p === "pick");
  if (p === "menu")            showPanel("p-menu");
  else if (p === "lobby")      showPanel(net.solo ? null : "p-room");
  else if (p === "pick")       showPanel(null);
  else if (p === "countdown")  showPanel(null);
  else if (p === "over")       showOver();
  else                         showPanel(null);
}

function paintPick(){
  if (net.phase !== "pick") return;
  const txt = net.seat === null ? "The players are choosing where to start."
    : iPicked() ? "<b>Locked in.</b> Waiting for the others to choose…"
    : "<b>Choose where to start</b> — tap one of the glowing circles.";
  if ($("pickMsg").innerHTML !== txt) $("pickMsg").innerHTML = txt;
}

let lastCd = -99;
function paintCountdown(now){
  if (net.phase === "lobby" && net.solo){
    if (lastCd !== -1){ lastCd = -1; $("countNum").textContent = ""; $("countSub").textContent = "Setting up…"; }
    return;
  }
  if (net.phase !== "countdown"){ lastCd = -99; return; }
  const n = Math.min(3, Math.max(0, Math.ceil((net.cdEnd - now) / 1000)));
  if (n === lastCd) return;
  lastCd = n;
  const el = $("countNum");
  el.textContent = n > 0 ? String(n) : "Go";
  $("countSub").textContent = n > 0 ? "Get ready" : " ";
  el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop");
}

function paintRoom(){
  if (!net.code) return;
  $("roomCode").textContent = net.code;
  const box = $("seats");
  box.textContent = "";
  for (let s = 0; s < FACTIONS.length; s++){
    const p = net.roster.find(x => x.seat === s);
    const row = document.createElement("div");
    row.className = "seat" + (p ? "" : " empty") + (p && p.pid === net.pid ? " mine" : "");
    const d = document.createElement("span");
    d.className = "dot"; d.style.background = FACTIONS[s].main; d.style.color = FACTIONS[s].main;
    const who = document.createElement("span");
    who.className = "who";
    who.textContent = p ? (p.name + (p.pid === net.pid ? " (you)" : "")) : "Open — played by AI";
    const badge = document.createElement("span"); badge.className = "badge";
    if (!p)                           badge.textContent = "AI";
    else if (p.pid === net.hostPid)   badge.textContent = "host";
    else if (!p.live)               { badge.textContent = "away"; badge.className = "badge away"; }
    else if (p.ready)               { badge.textContent = "ready"; badge.className = "badge on"; }
    else                              badge.textContent = "not ready";
    row.append(d, who, badge);
    box.appendChild(row);
  }
  const specs = net.roster.filter(p => p.seat === null);
  if (specs.length){
    const row = document.createElement("div"); row.className = "seat empty";
    row.textContent = specs.length + (specs.length === 1 ? " person watching" : " people watching");
    box.appendChild(row);
  }
  const others = net.roster.filter(p => p.seat !== null && p.live && !(net.host && p.pid === net.pid));
  const guests = net.host ? others : others.filter(p => p.pid !== net.pid);
  const readyN = guests.filter(p => p.ready).length;
  const start = $("btnStart"), ready = $("btnReady");
  start.style.display = net.host ? "" : "none";
  ready.style.display = net.host ? "none" : "";
  if (net.host) start.textContent = guests.length ? ("Start · " + readyN + "/" + guests.length + " ready") : "Start";
  else { ready.textContent = net.ready ? "Ready ✓" : "I'm ready"; ready.className = "btn " + (net.ready ? "ready-on" : "tinted"); }
  $("waitMsg").textContent = net.host ? "You can start whenever you like" : (net.ready ? "Waiting for the host to start" : "Tap ready when you are set");
  $("btnAgain").style.display = net.host ? "" : "none";
  $("againMsg").textContent = net.host ? " " : "Waiting for the host";
}

function showOver(){
  const w = net.winner;
  const mine = G.nodes.filter(n => n.owner === net.seat).length;
  const holder = net.roster.find(p => p.seat === w);
  $("overT").textContent =
    w === net.seat && net.seat !== null ? "The map is yours"
    : w == null ? "Match over"
    : (holder ? holder.name : FACTIONS[w] ? FACTIONS[w].name : "Someone") + " took the map";
  $("overP").innerHTML = "Held " + mine + " of " + (G.nodes.length || 30) + " &middot; " + fmt(G.elapsed);
  showPanel("p-over");
}

/* ══════════════════════════════════════════════════════════════
   Joining and hosting
   ══════════════════════════════════════════════════════════════ */
let tabId = "";
try { tabId = sessionStorage.getItem("holdings.tab") || ""; } catch (e){}
if (!tabId){ tabId = Math.random().toString(36).slice(2); try { sessionStorage.setItem("holdings.tab", tabId); } catch (e){} }
const HOLD_FRESH = 15000;
function loadSaved(){ try { return JSON.parse(localStorage.getItem("holdings") || "null"); } catch (e){ return null; } }
function resumablePid(code){
  const s = loadSaved();
  if (!s || s.code !== code) return null;
  if (s.tab === tabId || Date.now() - (s.ts || 0) > HOLD_FRESH) return s.pid;
  return null;
}
function otherTabHolds(code){
  const s = loadSaved();
  return !!(s && s.code === code && s.tab !== tabId && Date.now() - (s.ts || 0) < HOLD_FRESH);
}
function remember(){
  try {
    if (net.owner) localStorage.setItem("holdings", JSON.stringify({ code:net.code, pid:net.pid, tab:tabId, ts:Date.now() }));
    localStorage.setItem("holdings.name", nameVal());
  } catch (e){}
}
function enterRoom(code, pid, own){
  net.code = code; net.pid = pid; net.owner = own !== false; reAttempts = 0;
  remember();
  history.replaceState(null, "", location.pathname + "?r=" + code);
  connect(); paintHud();
}
setInterval(() => { if (net.owner && net.code) remember(); }, 5000);

async function playSolo(){
  $("menuErr").textContent = ""; net.solo = true;
  const r = await api("create", { name: nameVal(), code:null, pid:null });
  if (!r.ok){ net.solo = false; $("menuErr").textContent = r.error || "Could not start."; showStage(); return; }
  enterRoom(r.code, r.pid);
  const s = await api("start");
  if (!s.ok){ net.solo = false; showStage(); }
}

$("btnPlay").addEventListener("click", playSolo);
$("btnTut").addEventListener("click", startTutorial);
$("tutSkip").addEventListener("click", () => { exitTutorial(); showStage(); });
$("tutPlay").addEventListener("click", () => { exitTutorial(); playSolo(); });

$("btnCreate").addEventListener("click", async () => {
  $("menuErr").textContent = ""; net.solo = false;
  const r = await api("create", { name: nameVal(), code:null, pid:null });
  if (!r.ok) return ($("menuErr").textContent = r.error || "Could not create the room.");
  enterRoom(r.code, r.pid);
});

$("btnJoin").addEventListener("click", () => doJoin($("code").value));
$("code").addEventListener("keydown", e => { if (e.key === "Enter") doJoin($("code").value); });
$("name").addEventListener("keydown", e => { if (e.key === "Enter") $("btnPlay").click(); });

async function doJoin(raw){
  const code = String(raw || "").toUpperCase().trim();
  $("menuErr").textContent = "";
  if (code.length !== 4) return ($("menuErr").textContent = "Room codes are four characters.");
  net.solo = false;
  const pid = resumablePid(code);
  const r = await api("join", { code, pid, name: nameVal() });
  if (!r.ok) return ($("menuErr").textContent = r.error || "Could not join.");
  enterRoom(r.code, r.pid, !!pid || !otherTabHolds(code));
}

$("btnStart").addEventListener("click", () => api("start"));
$("btnReady").addEventListener("click", async () => { net.ready = !net.ready; paintRoom(); await api("ready", { ready: net.ready }); });
async function playAgain(){
  await api("restart");             /* everyone back to the shared lobby */
  if (net.solo) await api("start"); /* solo: no party to wait on — jump straight in */
}
$("btnAgain").addEventListener("click", playAgain);

async function copyLink(){
  const link = location.origin + location.pathname + "?r=" + net.code;
  try {
    await navigator.clipboard.writeText(link);
    $("btnCopy").textContent = "Link copied";
    setTimeout(() => ($("btnCopy").textContent = "Copy invite link"), 1600);
  } catch (e){ $("roomErr").textContent = link; }
}
$("btnCopy").addEventListener("click", copyLink);
$("roomCode").addEventListener("click", copyLink);

$("leave").addEventListener("click", () => {
  api("leave");
  if (net.es) net.es.close();
  if (net.owner) try { localStorage.removeItem("holdings"); } catch (e){}
  net.code = net.pid = null; net.seat = null; net.phase = "menu"; net.roster = [];
  net.owner = false; net.solo = false; net.ready = false;
  G.nodes = []; G.links = []; G.flights.clear(); G.elapsed = 0; pending = []; view = { c:[], ghosts:[] };
  history.replaceState(null, "", location.pathname);
  paintHud(); showStage();
});

const restartBtn = $("restart");
let armed = 0;
function disarm(){ armed = 0; restartBtn.classList.remove("armed"); restartBtn.textContent = "Restart"; }
function hitRestart(){
  if (!net.host || net.phase !== "live") return;
  if (armed > 0){ disarm(); playAgain(); return; }
  armed = 2.6; restartBtn.classList.add("armed"); restartBtn.textContent = "Sure?";
}
restartBtn.addEventListener("click", hitRestart);
addEventListener("keydown", e => {
  if (document.activeElement && document.activeElement.tagName === "INPUT") return;
  if (e.key === "r" || e.key === "R"){ e.preventDefault(); hitRestart(); }
  else if (e.key === "Escape") disarm();
});

/* ══════════════════════════════════════════════════════════════
   Boot
   ══════════════════════════════════════════════════════════════ */
buildHud();
paintHud();
showStage();
try { $("name").value = localStorage.getItem("holdings.name") || ""; } catch (e){}
const wanted = new URLSearchParams(location.search).get("r");
if (wanted){
  const c = wanted.toUpperCase().slice(0, 4);
  $("code").value = c;
  $("btnJoin").textContent = "Join " + c;
  $("btnJoin").className = "btn primary";
  $("btnPlay").className = "btn tinted";
  $("btnCreate").className = "btn ghost";
  $("orRow").textContent = "joining room " + c;
  if (resumablePid(c)) doJoin(c);
  else $("name").focus();
} else {
  const s = loadSaved();
  if (s && s.code && resumablePid(s.code)) doJoin(s.code);
}

let last = performance.now();
(function loop(now){
  let dt = (now - last) / 1000; last = now;
  if (dt > 1/20) dt = 1/20;
  if (armed > 0){ armed -= dt; if (armed <= 0) disarm(); }
  for (const n of G.nodes){
    if (n.pulse > 0) n.pulse = Math.max(0, n.pulse - dt * 2.6);
    if (n.flash > 0) n.flash = Math.max(0, n.flash - dt * 4.5);
  }
  if (net.phase === "live"){
    for (const fl of G.flights.values()) fl.prog += TROOP_SPEED * dt;
    G.elapsed += dt;
  } else if (net.phase === "tutorial"){
    tutTick(dt);
  }
  paintCountdown(now);
  rebuild();
  render();
  hud(dt);
  requestAnimationFrame(loop);
})(performance.now());

})();
</script>
</html>
